# =============================================================================
# Hindi-Marathi NMT — Local CPU Configuration
# This is the primary supported profile for running on a Windows CPU machine.
# =============================================================================

# --- Data ---
data:
  train_hi: data/train.hi
  train_mr: data/train.mr
  test_hi: data/test.hi
  test_mr: data/test.mr
  val_split: 0.05                # fraction of train used for validation
  max_train_examples: 10000      # keep only the first 10k sorted training pairs
  max_seq_len: 96                # max tokens per sentence (after BPE)
  min_seq_len: 2                 # min tokens per sentence
  processed_dir: outputs/processed

# --- Tokenizer ---
tokenizer:
  type: bpe                      # sentencepiece BPE
  vocab_size: 16000              # shared vocabulary size
  model_prefix: outputs/tokenizer/shared_bpe
  character_coverage: 1.0        # full coverage for Devanagari
  pad_id: 0
  unk_id: 1
  bos_id: 2
  eos_id: 3

# --- Model ---
model:
  embedding_dim: 256
  hidden_dim: 512
  num_layers: 1
  dropout: 0.2
  attention_type: bahdanau       # additive attention
  bidirectional_encoder: true
  embedding_type: random         # "random" or "bert"
  tie_embeddings: true           # share encoder/decoder embeddings (shared vocab)
  # BERT config (used only when embedding_type == bert)
  bert_hi_model: l3cube-pune/hindi-bert-v2
  bert_mr_model: l3cube-pune/marathi-bert-v2
  freeze_bert_embeddings: false

# --- Training ---
training:
  batch_size: 16
  num_epochs: 12
  learning_rate: 0.001
  optimizer: adamw                # adam or adamw
  weight_decay: 0.01
  grad_clip: 5.0
  label_smoothing: 0.1
  teacher_forcing_ratio: 1.0
  teacher_forcing_decay: 0.03    # reduce TF ratio by this per epoch
  num_workers: 2                 # small amount of parallel loading for CPU training
  seed: 42
  checkpoint_dir: outputs/checkpoints
  save_every_n_epochs: 4
  eval_every_n_epochs: 2

# --- Decoding ---
decoding:
  strategy: greedy               # "greedy" or "beam"
  beam_size: 5
  max_decode_len: 150
  length_penalty: 0.6

# --- MLflow ---
mlflow:
  enabled: false
  experiment_name: hi_mr_nmt_part1
  tracking_uri: outputs/mlruns

# --- Plotting ---
plotting:
  output_dir: outputs/plots
