# =============================================================================
# Colab-friendly configuration for a T4 GPU.
# This profile keeps the same data pipeline but reduces model and batch sizes.
# =============================================================================

data:
  train_hi: data/train.hi
  train_mr: data/train.mr
  test_hi: data/test.hi
  test_mr: data/test.mr
  val_split: 0.05
  max_seq_len: 96
  min_seq_len: 2
  processed_dir: outputs/processed

tokenizer:
  type: bpe
  vocab_size: 16000
  model_prefix: outputs/tokenizer/colab_shared_bpe
  character_coverage: 1.0
  pad_id: 0
  unk_id: 1
  bos_id: 2
  eos_id: 3

model:
  embedding_dim: 256
  hidden_dim: 512
  num_layers: 1
  dropout: 0.2
  attention_type: bahdanau
  bidirectional_encoder: true
  embedding_type: random
  tie_embeddings: true
  bert_hi_model: l3cube-pune/hindi-bert-v2
  bert_mr_model: l3cube-pune/marathi-bert-v2
  freeze_bert_embeddings: false

training:
  batch_size: 32
  num_epochs: 12
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0
  grad_clip: 5.0
  label_smoothing: 0.1
  teacher_forcing_ratio: 1.0
  teacher_forcing_decay: 0.03
  num_workers: 2
  seed: 42
  checkpoint_dir: outputs/checkpoints
  save_every_n_epochs: 4
  eval_every_n_epochs: 2

decoding:
  strategy: greedy
  beam_size: 5
  max_decode_len: 120
  length_penalty: 0.6

mlflow:
  enabled: false
  experiment_name: hi_mr_nmt_part1
  tracking_uri: outputs/mlruns

plotting:
  output_dir: outputs/plots